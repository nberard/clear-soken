<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Ça me fait penser à…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
/* Layout: une colonne aérée, cartes arrondies — bulle "on m'a dit" puis la référence ; ton doux, pastel, détendu */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eef2ee;
  --ink: #2c3a36;
  --muted: #6d7b76;
  --line: #dfe5df;
  --accent: #3f8a76;
  --accent-ink: #ffffff;
  --accent-soft: #d5ebe2;
  --bubble: #e9eef8;
  --danger: #c4524f;
  --tag-ink: #2f3532;
  --display: "Fredoka", "Nunito", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, sans-serif;
  --shadow: 0 1px 2px rgba(40,60,50,.05), 0 6px 18px rgba(40,60,50,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171c1b; --surface: #202725; --surface-2: #263030; --ink: #e6ece9; --muted: #9aa8a3; --line: #323d3a;
  --accent: #7cc7b0; --accent-ink: #15201c; --accent-soft: #2c4a41; --bubble: #2a3141; --danger: #ef8a86;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171c1b; --surface: #202725; --surface-2: #263030; --ink: #e6ece9; --muted: #9aa8a3; --line: #323d3a;
  --accent: #7cc7b0; --accent-ink: #15201c; --accent-soft: #2c4a41; --bubble: #2a3141; --danger: #ef8a86;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark }

* { box-sizing: border-box; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 28px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }

header { display: grid; gap: 6px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(1.8rem, 6vw, 2.4rem); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 .dots { color: var(--accent); }
.sub { color: var(--muted); margin: 0; }
.stats { color: var(--muted); font-size: .9rem; margin: 4px 0 0; font-variant-numeric: tabular-nums; }
.stats:empty { display: none; }

.panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 16px; }
.ptitle { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], textarea, select { width: 100%; background: var(--surface-2); border: 1px solid transparent; border-radius: 12px; padding: 10px 12px; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); outline: none; background: var(--surface); }
input::placeholder, textarea::placeholder { color: var(--muted); opacity: .8; }
textarea { resize: vertical; min-height: 46px; }

.side { display: grid; gap: 8px; min-width: 0; }
.label { font-size: .82rem; font-weight: 700; color: var(--muted); }
.bubble { position: relative; background: var(--bubble); border-radius: 16px 16px 16px 4px; padding: 2px; }
.bubble textarea { background: transparent; border: 0; font-weight: 600; font-size: 1.05rem; }
.bubble textarea:focus { background: transparent; }
.vs { color: var(--accent); text-align: center; font-size: 1.3rem; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; font-size: .9rem; font-weight: 600; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--c, var(--accent-soft)); border-color: transparent; color: var(--tag-ink); }
.chip[aria-pressed="true"][style*="accent-soft"] { color: var(--ink); }
.chip.add-chip { border-style: dashed; }
.chip.sm { padding: 2px 10px; font-size: .8rem; }

.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
.btn { border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.05); }
.btn.alt { background: var(--accent-soft); color: var(--ink); }
.btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.btn.danger { background: var(--danger); color: #fff; }
.btn[disabled] { opacity: .6; cursor: progress; }
.status { font-size: .9rem; color: var(--muted); margin-right: auto; }

.finder { background: var(--surface-2); border-radius: 16px; padding: 14px; display: grid; gap: 10px; }
.finder input[type=text] { background: var(--surface); }
.finder .hint, .hint { font-size: .9rem; color: var(--muted); margin: 0; }
.quick { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ext { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 700; text-decoration: none;
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); }
.ext:hover { border-color: var(--accent); color: var(--accent); }
.cands { display: grid; gap: 8px; }
.cand { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; }
.cand .t { font-weight: 700; overflow-wrap: anywhere; }
.cand .t small { color: var(--muted); font-weight: 400; }
.cand .d { font-size: .9rem; color: var(--muted); overflow-wrap: anywhere; }
.cand .row { justify-content: space-between; }

.tools { display: grid; gap: 10px; }
.tools .row { justify-content: space-between; }
.count { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.list { display: grid; gap: 14px; }
.card { display: grid; gap: 12px; padding: 16px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); }
.said { background: var(--bubble); border-radius: 16px 16px 16px 4px; padding: 10px 14px; font-weight: 600; font-size: 1.05rem; overflow-wrap: anywhere; justify-self: start; max-width: 100%; }
.said .tt { font-size: .75rem; font-weight: 700; color: var(--muted); margin-left: 8px; }
.loot { display: grid; gap: 4px; padding-left: 4px; }
.loot .ttl { font-family: var(--display); font-weight: 600; font-size: 1.15rem; overflow-wrap: anywhere; }
.loot .ttl .yr { font-family: var(--body); color: var(--muted); font-weight: 400; font-size: 1rem; }
.rar { display: inline-block; font-family: var(--body); font-size: .75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--c, var(--accent-soft)); color: var(--tag-ink); vertical-align: middle; margin-left: 4px; }
.loot .det { color: var(--muted); overflow-wrap: anywhere; }
.loot .note { font-style: italic; color: var(--muted); overflow-wrap: anywhere; }
.langs { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--muted); margin-top: 2px; }
.lg { padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); font-weight: 700; font-size: .75rem; }
.lg.diff { background: var(--accent-soft); }
.langrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.langrow .label { white-space: nowrap; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.link { background: none; border: 0; color: var(--muted); font-size: .9rem; padding: 4px 6px; }
.link:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.link.del:hover { color: var(--danger); }
.empty { text-align: center; color: var(--muted); padding: 30px 14px; border: 2px dashed var(--line); border-radius: 20px; }
.empty b { display: block; font-family: var(--display); font-weight: 600; font-size: 1.1rem; color: var(--ink); margin-bottom: 4px; }
.banner { font-size: .92rem; padding: 10px 14px; background: var(--accent-soft); border-radius: 12px; }

details.cats { background: var(--surface); border-radius: 20px; padding: 14px 18px; box-shadow: var(--shadow); }
details.cats summary { cursor: pointer; font-weight: 700; color: var(--muted); }
.cat-edit { display: grid; gap: 10px; margin-top: 14px; }
.cat-item { display: inline-flex; align-items: center; gap: 4px; }
.cat-item button { border: 0; background: none; color: var(--muted); padding: 0 2px; font-size: 1rem; }
.cat-item button:hover { color: var(--danger); }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  background: var(--ink); color: var(--bg); border-radius: 16px; padding: 10px 18px; text-align: center; font-weight: 700; z-index: 20;
  max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.toast small { display: block; font-weight: 400; opacity: .8; }

.pair { display: grid; gap: 14px; }
@media (min-width: 620px) { .pair { grid-template-columns: 1fr auto 1fr; align-items: start; } .vs { padding-top: 34px; } }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translate(-50%, 12px); opacity: 0; } }
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Ça me fait penser à<span class="dots">…</span></h1>
    <p class="stats" id="stats"></p>
  </header>

  <div id="banner" class="banner" hidden></div>

  <form class="panel" id="form" autocomplete="off">
    <h2 class="ptitle" id="formTitle">Nouvelle référence</h2>
    <div class="pair">
      <div class="side">
        <span class="label">On m'a dit</span>
        <div class="chips" id="trigTypes"></div>
        <div class="bubble"><textarea id="trigger" rows="2" placeholder="« Je reviendrai… »" required></textarea></div>
        <div class="langrow"><span class="label">Langue</span><div class="chips" id="srcLangs"></div></div>
      </div>
      <div class="vs" aria-hidden="true">→</div>
      <div class="side">
        <span class="label">Ça m'évoque</span>
        <div class="chips" id="refTypes"></div>
        <input type="text" id="refTitle" placeholder="Titre (film, chanson, série…)" required>
        <input type="text" id="refYear" placeholder="Année ou artiste (facultatif)">
        <input type="text" id="refDetail" placeholder="Le moment précis, la réplique…">
        <div class="langrow"><span class="label">Langue</span><div class="chips" id="refLangs"></div></div>
      </div>
    </div>

    <div class="finder" id="finder">
      <span class="label">Retrouver la référence</span>
      <div class="row" style="justify-content:flex-start">
        <input type="text" id="clue" placeholder="Décris la scène, la chanson…" style="flex:1;min-width:180px">
        <button type="button" class="btn alt" id="askBtn">Chercher</button>
      </div>
      <div class="quick" id="quick"></div>
      <div class="cands" id="cands"></div>
    </div>

    <textarea id="note" rows="1" placeholder="Note perso (facultatif)"></textarea>
    <div class="row">
      <span class="status" id="status" role="status"></span>
      <button type="button" class="btn ghost" id="cancelEdit" hidden>Annuler</button>
      <button type="submit" class="btn" id="submitBtn">Ajouter</button>
    </div>
  </form>

  <section class="tools">
    <div class="row">
      <h2 class="ptitle">Mes références</h2>
      <span class="count" id="count"></span>
    </div>
    <input type="text" id="q" placeholder="Rechercher un mot, un titre…" aria-label="Rechercher">
    <div class="chips" id="filters"></div>
  </section>

  <div class="list" id="list"><div class="empty"><b>Chargement…</b></div></div>

  <details class="cats" id="catsBox">
    <summary>Gérer les catégories</summary>
    <div class="cat-edit">
      <span class="label">Types de références</span>
      <div class="chips" id="refCatsEdit"></div>
      <span class="label">Ce qu'on m'a dit</span>
      <div class="chips" id="trigCatsEdit"></div>
      <span class="label">Langues</span>
      <div class="chips" id="langCatsEdit"></div>
      <div class="row" style="justify-content:flex-start">
        <select id="catKind" aria-label="Liste" style="width:auto"><option value="ref">Type de référence</option><option value="trig">Type de déclencheur</option><option value="lang">Langue</option></select>
        <input type="text" id="catName" placeholder="Nouvelle catégorie" style="flex:1;min-width:140px">
        <button type="button" class="btn alt" id="catAdd">Ajouter</button>
      </div>
    </div>
  </details>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DEFAULT_REF = ["Chanson", "Film", "Série", "Livre", "Pub", "Jeu vidéo", "Mème"];
const DEFAULT_TRIG = ["Mot", "Phrase", "Situation"];
const DEFAULT_LANG = ["Français", "Anglais", "Espagnol", "Italien", "Allemand"];
const LANG_CODES = { "francais": "FR", "anglais": "EN", "espagnol": "ES", "italien": "IT", "allemand": "DE", "portugais": "PT", "japonais": "JA", "coreen": "KO", "chinois": "ZH", "arabe": "AR", "russe": "RU", "neerlandais": "NL" };
function langCode(l) { return LANG_CODES[norm(l)] || (l || "").slice(0, 2).toUpperCase(); }
const COLORS = { "Chanson": "#bfe3c9", "Film": "#f6dca0", "Série": "#bcdcf0", "Livre": "#f3cdb5", "Pub": "#f2c9dc", "Jeu vidéo": "#d6cdf2", "Mème": "#e6e1a8" };
const SPARE = ["#cfe8dc", "#f0d6c4", "#d4def4", "#efe3b4", "#e9d0ec", "#c9e6e6"];
const ACHIEVEMENTS = { 1: "Première référence notée", 10: "10 références, joli", 50: "50 références, quelle mémoire", 100: "100 références !" };

const $ = (id) => document.getElementById(id);
let suggestOn = false, mode = "loading";
let refs = [];
let cats = { ref: DEFAULT_REF.slice(), trig: DEFAULT_TRIG.slice(), lang: DEFAULT_LANG.slice() };
let sel = { trig: "Phrase", ref: "Film", srcLang: "Français", refLang: "Anglais" };
let filter = "Tout", editingId = null, pendingDelete = null;

function colorFor(type) {
  if (COLORS[type]) return COLORS[type];
  let h = 0; for (const ch of type || "") h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return SPARE[h % SPARE.length];
}
function norm(s) { return (s || "").toString().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- liens de recherche ---------- */
function searchLinks(type, title, extra) {
  const q = encodeURIComponent([title, extra].filter(Boolean).join(" "));
  const qt = encodeURIComponent(title);
  const L = {
    imdb: ["IMDb", "imdb", "https://www.imdb.com/find/?q=" + qt],
    yt: ["YouTube", "yt", "https://www.youtube.com/results?search_query=" + q],
    sp: ["Spotify", "sp", "https://open.spotify.com/search/" + q],
    gen: ["Paroles", "gen", "https://genius.com/search?q=" + q],
    gg: ["Google", "gg", "https://www.google.com/search?q=" + q],
  };
  const t = norm(type);
  let keys;
  if (/chanson|musique|son/.test(t)) keys = ["yt", "sp", "gen"];
  else if (/film|serie|pub|anim|dessin|docu|emission|tele/.test(t)) keys = ["imdb", "yt"];
  else if (/jeu/.test(t)) keys = ["yt", "gg"];
  else keys = ["gg", "yt"];
  if (!keys.includes("gg")) keys.push("gg");
  return keys.map(k => L[k]);
}
function linkEls(type, title, extra) {
  return searchLinks(type, title, extra).map(([label, cls, href]) => {
    const a = document.createElement("a"); a.className = "ext " + cls; a.href = href; a.target = "_blank"; a.rel = "noopener";
    a.textContent = label + " ↗"; return a;
  });
}

/* ---------- stockage (API du serveur) ---------- */
async function api(method, path, body) {
  const res = await fetch("api/" + path, {
    method, headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined, credentials: "same-origin",
  });
  if (!res.ok) { const e = new Error("HTTP " + res.status); e.status = res.status; throw e; }
  return res.status === 204 ? null : res.json();
}
async function saveRef(id, data) {
  await api("PUT", "refs/" + encodeURIComponent(id), data);
  const i = refs.findIndex(r => r.id === id); const row = { id, ...data };
  if (i >= 0) refs[i] = row; else refs.push(row);
  render();
}
async function deleteRef(id) {
  await api("DELETE", "refs/" + encodeURIComponent(id));
  refs = refs.filter(r => r.id !== id); render();
}
async function saveCats() {
  renderCats();
  await api("PUT", "categories", { ref: cats.ref, trig: cats.trig, lang: cats.lang });
}
async function load() {
  try {
    const d = await api("GET", "data");
    refs = Array.isArray(d.refs) ? d.refs : [];
    if (d.cats) cats = { ref: (d.cats.ref || DEFAULT_REF).slice(), trig: (d.cats.trig || DEFAULT_TRIG).slice(), lang: (d.cats.lang || DEFAULT_LANG).slice() };
    suggestOn = !!d.suggest;
    mode = "ready"; banner("");
  } catch (e) {
    if (mode === "loading") mode = "ready";
    banner("Impossible de joindre le serveur. Recharge la page dans un moment.");
  }
  renderCats();
}

/* ---------- rendu ---------- */
function chip(label, pressed, onClick, extraClass, color) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (extraClass ? " " + extraClass : "");
  b.textContent = label; b.setAttribute("aria-pressed", pressed ? "true" : "false");
  if (color) b.style.setProperty("--c", color);
  b.addEventListener("click", onClick); return b;
}

function renderHud() {
  const n = refs.length;
  const langs = new Set(refs.flatMap(r => [r.srcLang, r.refLang]).filter(Boolean));
  const cross = refs.filter(r => r.srcLang && r.refLang && r.srcLang !== r.refLang).length;
  $("stats").textContent = n ? n + (n > 1 ? " références" : " référence") + " · " + langs.size + (langs.size > 1 ? " langues" : " langue") + (cross ? " · " + cross + " entre deux langues" : "") : "";
}

function renderQuick() {
  const title = $("refTitle").value.trim();
  const q = $("quick");
  if (!title) { q.replaceChildren(); return; }
  const lab = document.createElement("span"); lab.className = "label"; lab.textContent = "Vérifier sur";
  q.replaceChildren(lab, ...linkEls(sel.ref, title, $("refYear").value.trim()));
}

function renderCats() {
  if (!cats.trig.includes(sel.trig)) sel.trig = cats.trig[0] || "";
  if (!cats.ref.includes(sel.ref)) sel.ref = cats.ref[0] || "";
  if (!cats.lang.includes(sel.srcLang)) sel.srcLang = cats.lang[0] || "";
  if (!cats.lang.includes(sel.refLang)) sel.refLang = cats.lang[0] || "";
  $("srcLangs").replaceChildren(...cats.lang.map(l => chip(langCode(l), l === sel.srcLang, () => { sel.srcLang = l; renderCats(); }, "sm", "var(--accent-soft)")));
  $("refLangs").replaceChildren(...cats.lang.map(l => chip(langCode(l), l === sel.refLang, () => { sel.refLang = l; renderCats(); }, "sm", "var(--accent-soft)")));
  [...$("srcLangs").children, ...$("refLangs").children].forEach((b, i) => { b.title = cats.lang[i % cats.lang.length]; });
  $("trigTypes").replaceChildren(...cats.trig.map(c => chip(c, c === sel.trig, () => { sel.trig = c; renderCats(); }, "", "var(--accent-soft)")));
  const rt = $("refTypes");
  rt.replaceChildren(...cats.ref.map(c => chip(c, c === sel.ref, () => { sel.ref = c; renderCats(); }, "", colorFor(c))));
  rt.appendChild(chip("+ autre", false, () => { $("catsBox").open = true; $("catKind").value = "ref"; $("catName").focus(); }, "add-chip"));
  const mkEdit = (kind) => cats[kind].map(c => {
    const s = document.createElement("span"); s.className = "chip cat-item";
    const t = document.createElement("span"); t.textContent = c;
    const x = document.createElement("button"); x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "Retirer " + c);
    x.addEventListener("click", () => { if (cats[kind].length <= 1) return; cats[kind] = cats[kind].filter(v => v !== c); saveCats().catch(showErr); });
    s.append(t, x); return s;
  });
  $("refCatsEdit").replaceChildren(...mkEdit("ref"));
  $("trigCatsEdit").replaceChildren(...mkEdit("trig"));
  $("langCatsEdit").replaceChildren(...mkEdit("lang"));
  renderQuick(); render();
}

function render() {
  renderHud();
  const used = new Set(refs.map(r => r.refType));
  const filterList = ["Tout", ...cats.ref.filter(c => used.has(c)), ...[...used].filter(c => c && !cats.ref.includes(c))];
  if (!filterList.includes(filter)) filter = "Tout";
  $("filters").replaceChildren(...filterList.map(c => chip(c, c === filter, () => { filter = c; render(); }, "", c === "Tout" ? "var(--accent-soft)" : colorFor(c))));

  const q = norm($("q").value.trim());
  const shown = refs
    .filter(r => filter === "Tout" || r.refType === filter)
    .filter(r => !q || norm([r.trigger, r.refTitle, r.refYear, r.refDetail, r.note, r.refType, r.trigType, r.srcLang, r.refLang].join(" ")).includes(q))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  $("count").textContent = refs.length ? (shown.length === refs.length ? refs.length + " au total" : shown.length + " / " + refs.length) : "";

  const list = $("list");
  if (mode === "loading") { list.innerHTML = '<div class="empty"><b>Chargement…</b></div>'; return; }
  if (!refs.length) { list.innerHTML = '<div class="empty"><b>Rien pour l\'instant</b></div>'; return; }
  if (!shown.length) { list.innerHTML = '<div class="empty"><b>Aucun résultat</b>Rien ne correspond à ta recherche.</div>'; return; }

  list.replaceChildren(...shown.map(r => {
    const c = document.createElement("article"); c.className = "card"; c.style.setProperty("--c", colorFor(r.refType));
    const said = document.createElement("div"); said.className = "said";
    said.append("« " + r.trigger + " »");
    if (r.trigType) { const tt = document.createElement("span"); tt.className = "tt"; tt.textContent = r.trigType; said.append(tt); }

    const loot = document.createElement("div"); loot.className = "loot";
    const ttl = document.createElement("div"); ttl.className = "ttl";
    ttl.append(r.refTitle);
    if (r.refYear) { const y = document.createElement("span"); y.className = "yr"; y.textContent = " (" + r.refYear + ")"; ttl.append(y); }
    const rar = document.createElement("span"); rar.className = "rar"; rar.textContent = r.refType || ""; ttl.append(" ", rar);
    loot.append(ttl);
    if (r.refDetail) { const d = document.createElement("div"); d.className = "det"; d.textContent = r.refDetail; loot.append(d); }
    if (r.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = r.note; loot.append(n); }

    if (r.srcLang || r.refLang) {
      const lg = document.createElement("div"); lg.className = "langs";
      const diff = r.srcLang && r.refLang && r.srcLang !== r.refLang;
      const a = document.createElement("span"); a.className = "lg" + (diff ? " diff" : ""); a.textContent = langCode(r.srcLang) || "?"; a.title = "Dit en " + (r.srcLang || "?");
      const b = document.createElement("span"); b.className = "lg" + (diff ? " diff" : ""); b.textContent = langCode(r.refLang) || "?"; b.title = "Référence en " + (r.refLang || "?");
      lg.append(a, "→", b);
      if (diff) lg.append(" · autre langue");
      loot.append(lg);
    }
    const foot = document.createElement("div"); foot.className = "foot";
    const links = document.createElement("div"); links.className = "quick"; links.append(...linkEls(r.refType, r.refTitle, r.refYear));
    const act = document.createElement("div"); act.className = "row";
    if (pendingDelete === r.id) {
      const lab = document.createElement("span"); lab.className = "status"; lab.textContent = "Supprimer ?";
      const no = document.createElement("button"); no.className = "btn ghost"; no.textContent = "Non"; no.onclick = () => { pendingDelete = null; render(); };
      const yes = document.createElement("button"); yes.className = "btn danger"; yes.textContent = "Supprimer";
      yes.onclick = () => { pendingDelete = null; deleteRef(r.id).catch(showErr); };
      act.append(lab, no, yes);
    } else {
      const e = document.createElement("button"); e.className = "link"; e.textContent = "Modifier"; e.onclick = () => startEdit(r);
      const d = document.createElement("button"); d.className = "link del"; d.textContent = "Supprimer"; d.onclick = () => { pendingDelete = r.id; render(); };
      act.append(e, d);
    }
    foot.append(links, act);
    c.append(said, loot, foot);
    return c;
  }));
}

/* ---------- trouver la référence (Claude) ---------- */
let askCtl = null;
async function ask() {
  const clue = $("clue").value.trim() || $("trigger").value.trim();
  if (!clue) { $("clue").focus(); return; }
  if (!suggestOn) {
    $("cands").replaceChildren();
    const box = document.createElement("div"); box.className = "quick"; box.append(...linkEls(sel.ref, clue));
    $("cands").append(box); return;
  }
  askCtl?.abort(); askCtl = new AbortController();
  const btn = $("askBtn"); btn.disabled = true; btn.textContent = "Je cherche…";
  $("cands").innerHTML = '<p class="hint">Claude réfléchit…</p>';
  try {
    const res = await fetch("api/suggest", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: askCtl.signal,
      body: JSON.stringify({ said: $("trigger").value.trim(), srcLang: sel.srcLang, refLang: sel.refLang, clue, type: sel.ref, types: cats.ref }),
    }).then(r => { if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; } return r.json(); });
    const list = Array.isArray(res?.candidates) ? res.candidates.slice(0, 5) : [];
    if (!list.length) { $("cands").innerHTML = '<p class="hint">Aucune idée. Essaie de décrire autrement.</p>'; return; }
    $("cands").replaceChildren(...list.map(cd => {
      const box = document.createElement("div"); box.className = "cand";
      const t = document.createElement("div"); t.className = "t";
      t.append(String(cd.title || "?"));
      const sm = document.createElement("small"); sm.textContent = " · " + [cd.type, cd.year].filter(Boolean).join(" · "); t.append(sm);
      const d = document.createElement("div"); d.className = "d"; d.textContent = [cd.detail, cd.why].filter(Boolean).join(" — ");
      const row = document.createElement("div"); row.className = "row";
      const links = document.createElement("div"); links.className = "quick"; links.append(...linkEls(cd.type || sel.ref, String(cd.title || ""), cd.year));
      const pick = document.createElement("button"); pick.type = "button"; pick.className = "btn alt"; pick.textContent = "Choisir";
      pick.onclick = () => pickCandidate(cd);
      row.append(links, pick);
      box.append(t, d, row); return box;
    }));
  } catch (err) {
    if (err?.name === "AbortError") return;
    $("cands").innerHTML = "";
    const p = document.createElement("p"); p.className = "hint";
    p.textContent = err?.status === 429 ? "Trop de recherches d'un coup, réessaie dans un moment." : "La recherche a échoué, réessaie.";
    $("cands").append(p);
  } finally { btn.disabled = false; btn.textContent = "Chercher"; }
}
function pickCandidate(cd) {
  $("refTitle").value = cd.title || "";
  $("refYear").value = cd.year || "";
  if (cd.detail && !$("refDetail").value.trim()) $("refDetail").value = cd.detail;
  if (cd.type) {
    const match = cats.ref.find(c => norm(c) === norm(cd.type));
    if (match) sel.ref = match;
  }
  $("cands").replaceChildren();
  renderCats();
  $("refTitle").focus();
}
$("askBtn").onclick = ask;
$("clue").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); ask(); } });
$("refTitle").addEventListener("input", renderQuick);
$("refYear").addEventListener("input", renderQuick);

/* ---------- formulaire ---------- */
function startEdit(r) {
  editingId = r.id;
  $("trigger").value = r.trigger || ""; $("refTitle").value = r.refTitle || ""; $("refYear").value = r.refYear || "";
  $("refDetail").value = r.refDetail || ""; $("note").value = r.note || "";
  if (r.trigType && !cats.trig.includes(r.trigType)) cats.trig.push(r.trigType);
  if (r.refType && !cats.ref.includes(r.refType)) cats.ref.push(r.refType);
  for (const l of [r.srcLang, r.refLang]) if (l && !cats.lang.includes(l)) cats.lang.push(l);
  sel.trig = r.trigType; sel.ref = r.refType;
  if (r.srcLang) sel.srcLang = r.srcLang; if (r.refLang) sel.refLang = r.refLang;
  $("formTitle").textContent = "Modifier la référence";
  $("submitBtn").textContent = "Enregistrer"; $("cancelEdit").hidden = false;
  renderCats();
  $("form").scrollIntoView({ behavior: "smooth", block: "start" });
}
function resetForm() {
  editingId = null; $("form").reset(); $("cands").replaceChildren();
  $("formTitle").textContent = "Nouvelle référence";
  $("submitBtn").textContent = "Ajouter"; $("cancelEdit").hidden = true;
  renderQuick();
}
$("cancelEdit").onclick = resetForm;

let toastTimer;
function toast(main, small) {
  const t = $("toast"); t.replaceChildren(main);
  if (small) { const s = document.createElement("small"); s.textContent = small; t.append(s); }
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2600);
}

let saving = false;
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (saving) return;
  const trigger = $("trigger").value.trim(), refTitle = $("refTitle").value.trim();
  if (!trigger || !refTitle) return;
  const isNew = !editingId;
  const old = editingId ? refs.find(r => r.id === editingId) : null;
  const data = {
    trigger, trigType: sel.trig, refTitle, refType: sel.ref, srcLang: sel.srcLang, refLang: sel.refLang,
    refYear: $("refYear").value.trim(), refDetail: $("refDetail").value.trim(), note: $("note").value.trim(),
    createdAt: old?.createdAt || Date.now(), updatedAt: Date.now(),
  };
  saving = true; $("status").textContent = "Sauvegarde…";
  try {
    const before = refs.length;
    await saveRef(editingId || newId(), data);
    $("status").textContent = "";
    if (isNew) {
      const n = before + 1;
      toast(ACHIEVEMENTS[n] || "Ajouté", refTitle);
    } else toast("Modifié", refTitle);
    resetForm();
  } catch (err) { showErr(err); }
  saving = false;
});

$("q").addEventListener("input", render);
$("catAdd").onclick = () => {
  const name = $("catName").value.trim(); const kind = $("catKind").value;
  if (!name) return;
  if (!cats[kind].some(c => norm(c) === norm(name))) cats[kind].push(name);
  if (kind === "ref") sel.ref = name; else if (kind === "trig") sel.trig = name;
  $("catName").value = ""; saveCats().catch(showErr);
};
$("catName").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("catAdd").click(); } });

function showErr(err) {
  const st = err && err.status;
  $("status").textContent = st === 413 ? "Texte trop long." : st === 401 ? "Session expirée : recharge la page." : "Impossible d'enregistrer, réessaie.";
}
function banner(text) { const b = $("banner"); b.textContent = text; b.hidden = !text; }

/* ---------- démarrage ---------- */
renderCats();
load();
// Reprend les ajouts faits depuis un autre appareil quand on revient sur l'onglet
document.addEventListener("visibilitychange", () => { if (!document.hidden && !editingId && !saving) load(); });
</script>
</body>
</html>
