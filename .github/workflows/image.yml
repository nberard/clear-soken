# Tests puis image Docker de l'appli, publiée sur GitHub Container Registry à chaque fusion dans main.
# Le serveur ne compile plus rien : make deploy télécharge l'image (docker compose pull).
#   ghcr.io/nberard/clear-soken:latest      dernière version de main
#   ghcr.io/nberard/clear-soken:sha-<court> version d'un commit précis (pour revenir en arrière)
name: Image Docker

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "mint-health/**", "proxy/**"]
  pull_request:
    paths-ignore: ["**.md", "mint-health/**", "proxy/**"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Front (types, logique)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: API (tests)
        working-directory: backend
        run: cargo test

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clear-soken
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      - name: Build (et publication hors PR)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
