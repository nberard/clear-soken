# Tout écoute uniquement sur 127.0.0.1 : rien n'est exposé sur le réseau local.
name: mint-health

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: health
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health"]
      interval: 5s
      retries: 20

  sync:
    build: ./sync
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://health:${POSTGRES_PASSWORD}@db:5432/health
      TOKEN_FILE: /data/token.json
    volumes:
      - tokens:/data
    ports:
      - "127.0.0.1:8765:8765"

  renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped
    environment:
      # Jeton partagé avec Grafana (obligatoire : Grafana refuse la valeur par défaut)
      AUTH_TOKEN: ${RENDERER_TOKEN:?RENDERER_TOKEN manquant dans mint-health/.env (openssl rand -hex 32)}

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    depends_on: [db, renderer]
    environment:
      TZ: ${TZ:-Europe/Paris}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: http://localhost:3000/
      # Intégration « transparente » : iframe/WebKit + consultation sans login (lecture seule)
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/google-health.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Rendu PNG des panneaux (affichés dans le menu de l'applet)
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_RENDERER_TOKEN: ${RENDERER_TOKEN:?RENDERER_TOKEN manquant dans mint-health/.env (openssl rand -hex 32)}
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata:
  tokens:
  grafana:
