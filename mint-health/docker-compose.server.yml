# Surcouche pour le serveur : publie sync et Grafana derrière le Caddy commun
# (réseau Docker "proxy"), sous https://${HEALTH_HOST}/health.
# Utilisation : make health-deploy (à la racine du dépôt)
services:
  sync:
    container_name: mint-health-sync
    environment:
      PUBLIC_URL: https://${HEALTH_HOST}/health/api
    networks: [default, proxy]

  grafana:
    container_name: mint-health-grafana
    environment:
      GF_SERVER_ROOT_URL: https://${HEALTH_HOST}/health/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/health/
      # Le mot de passe est géré par Caddy : Grafana doit ignorer l'en-tête Basic qu'il transmet.
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_COOKIE_SECURE: "true"
    networks: [default, proxy]

networks:
  proxy:
    external: true
