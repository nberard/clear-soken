# Appli Clear Soken. Le HTTPS et les domaines sont gérés par le proxy (dossier proxy/),
# qu'il faut démarrer avant : voir README.
services:
  clearsoken:
    # Image construite par GitHub Actions (.github/workflows/image.yml) ; make deploy la télécharge.
    # make deploy TAG=sha-abc1234 pour revenir à une version précise ; make build-local pour construire ici.
    image: ghcr.io/nberard/clear-soken:${TAG:-latest}
    build: .
    container_name: clearsoken
    restart: unless-stopped
    env_file: .env                    # prix des plans (PRIX_JOUR_CENTIMES…), créé depuis .env.example par make deploy
    volumes:
      - ./backend/data:/app/data:ro   # l'annuaire se modifie sans rebuild (puis : make restart)
    ports:
      - "127.0.0.1:8090:8080"         # accès local (debug) : curl localhost:8090 ; 8080 est pris par Jenkins
    networks:
      - proxy

networks:
  proxy:
    external: true
